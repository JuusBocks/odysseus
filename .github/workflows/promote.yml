name: Promote verified changes

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Promotion target"
        required: true
        type: choice
        options:
          - nonprod
          - prod

permissions:
  contents: write

concurrency:
  group: promote-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote to ${{ inputs.target }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve branches
        id: branches
        run: |
          set -euo pipefail
          if [ "${{ inputs.target }}" = "nonprod" ]; then
            echo "source=leounib-dev" >> "$GITHUB_OUTPUT"
            echo "target=leounib-nonprod" >> "$GITHUB_OUTPUT"
            echo "environment=nonprod" >> "$GITHUB_OUTPUT"
          else
            echo "source=leounib-nonprod" >> "$GITHUB_OUTPUT"
            echo "target=leounib-main" >> "$GITHUB_OUTPUT"
            echo "environment=prod" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout target branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ steps.branches.outputs.target }}
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch source branch
        run: |
          set -euo pipefail
          git fetch origin \
            "${{ steps.branches.outputs.source }}" \
            "${{ steps.branches.outputs.target }}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"

      - name: Verify source branch
        run: |
          set -euo pipefail
          git switch --detach "origin/${{ steps.branches.outputs.source }}"
          python -m compileall -q app.py core routes src services scripts tests
          shopt -s globstar nullglob
          for f in static/app.js static/js/**/*.js; do
            node --check "$f"
          done

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Smoke test source branch
        env:
          ODYSSEUS_ENVIRONMENT: ${{ steps.branches.outputs.environment }}
          AUTH_ENABLED: "false"
          LOCALHOST_BYPASS: "false"
          APP_BIND: "127.0.0.1"
          APP_PORT: "7860"
        run: |
          set -euo pipefail
          mkdir -p data
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request

          proc = subprocess.Popen(
              [sys.executable, "-m", "uvicorn", "app:app", "--host", "127.0.0.1", "--port", "7860"],
              env=os.environ.copy(),
          )

          def fetch(path):
              with urllib.request.urlopen(f"http://127.0.0.1:7860{path}", timeout=5) as response:
                  body = response.read().decode("utf-8", errors="replace")
                  return response.status, body

          try:
              deadline = time.time() + 90
              last_error = None
              while time.time() < deadline:
                  if proc.poll() is not None:
                      raise RuntimeError(f"app exited early with code {proc.returncode}")
                  try:
                      status, body = fetch("/api/health")
                      if status == 200 and json.loads(body).get("status") == "healthy":
                          break
                  except (OSError, urllib.error.URLError, json.JSONDecodeError) as exc:
                      last_error = exc
                  time.sleep(2)
              else:
                  raise RuntimeError(f"app did not become healthy: {last_error}")

              for path, expected in (
                  ("/", "Odysseus"),
                  ("/api/runtime", "ollama_base_url"),
                  ("/api/dashboard/system", "hardware"),
              ):
                  status, body = fetch(path)
                  if status != 200 or expected not in body:
                      raise RuntimeError(f"{path} smoke check failed: status={status}, expected={expected!r}")
          finally:
              proc.terminate()
              try:
                  proc.wait(timeout=15)
              except subprocess.TimeoutExpired:
                  proc.kill()
                  proc.wait(timeout=10)
          PY

      - name: Fast-forward target branch
        run: |
          set -euo pipefail
          git switch -C "${{ steps.branches.outputs.target }}" "origin/${{ steps.branches.outputs.target }}"
          git merge --ff-only "origin/${{ steps.branches.outputs.source }}"
          git push origin "${{ steps.branches.outputs.target }}"
